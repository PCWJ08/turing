<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图灵聊天室</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<div class="app">
  <div class="topbar">
    <span class="pulse"></span>
    <span class="title">TURING CHAMBER</span>
    <span class="me" id="me-name">—</span>
  </div>

  <div id="messages">
    <div class="empty">等待连接…</div>
  </div>

  <div class="input-row">
    <input id="input" type="text" maxlength="60" placeholder="输入你的发言..." autocomplete="off">
    <button id="send-btn" disabled>发送</button>
  </div>

  <div class="meta-row">
    <span id="status">未连接</span>
    <span style="color: #b026ff; font-weight: bold; font-size: 12px; letter-spacing: 2px; text-shadow: 0 0 5px rgba(176, 38, 255, 0.5);">Designed by WeiDengLu</span>
    <span id="counter">0 / 60</span>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
