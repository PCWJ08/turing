<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图灵聊天室</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/static/theme.css">
</head>
<body>

<div class="app">
  <div class="topbar">
    <span class="pulse"></span>
    <span class="title">TURING CHAMBER</span>
    <span class="me" id="me-name">—</span>
  </div>

  <div id="messages">
    <div class="msg" id="sys-welcome">
      <span class="sender" style="color: #666;">[系统]</span>
      <span class="content" style="color: #888;">警告：你已进入重度精神科，请尝试与患者交流...</span>
    </div>
  </div>

  <div class="input-row">
    <input id="input" type="text" maxlength="60" placeholder="院长，请对他们说点什么..." autocomplete="off">
    <button id="send-btn" disabled>发送</button>
  </div>

  <div class="meta-row">
    <span id="status">未连接</span>
    <span style="color: #a200ff; font-weight: bold; font-size: 12px; letter-spacing: 2px; text-shadow: 0 0 5px rgba(149, 32, 218, 0.5);">Designed by 未登录</span>
    <span id="counter">0 / 60</span>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
